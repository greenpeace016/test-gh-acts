name: remote-dev-runner

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "Node hostname in Tailscale (default my-temp-runner)"
        required: false
        type: string
        default: "my-temp-runner"

concurrency:
  group: remote-dev-runner
  cancel-in-progress: true

permissions:
  # GITHUB_TOKEN needs actions:write for the cache-prune step (DELETE /actions/caches/{id})
  actions: write
  contents: read

env:
  SSH_PORT: ${{ secrets.SSH_PORT }}
  OPENCODE_PORT: ${{ secrets.OPENCODE_PORT }}
  STOP_PORT: ${{ secrets.STOP_PORT }}
  SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
  STOP_TOKEN: ${{ secrets.STOP_TOKEN }}
  OPENSSH_PRIVATE_KEY: ${{ secrets.OPENSSH_PRIVATE_KEY }}

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # single-slot cache keys are namespaced by the node hostname
      CACHED_NODE_HOST: ${{ inputs.hostname || 'my-temp-runner' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install & connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: ${{ inputs.hostname || 'my-temp-runner' }}
          untrusted-userspace: false
          args: --advertise-exit-node
          version: latest

      - name: Configure Git SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${OPENSSH_PRIVATE_KEY}" > ~/.ssh/git_key

          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/git_key

          cat > ~/.ssh/config << 'EOF'
          Host github.com
            HostName github.com
            User git
            IdentityFile ~/.ssh/git_key
            IdentitiesOnly yes
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

          echo "Testing SSH connection to GitHub..."
          ssh -T git@github.com || echo "SSH test completed (may show 'successfully authenticated' or permission denied if key is read-only)"

      - name: Configure sshd
        run: |
          sudo mkdir -p /etc/ssh/sshd_config.d /run/sshd
          printf 'PermitRootLogin no\nPasswordAuthentication yes\n' | \
            sudo tee /etc/ssh/sshd_config.d/99-runner.conf >/dev/null

          echo "runner:${SSH_PASSWORD}" | sudo chpasswd

          sudo ssh-keygen -A
          sudo /usr/sbin/sshd -p "${SSH_PORT}"

          if ss -tln | grep -q ":${SSH_PORT}"; then
            echo "[sshd] listening on :${SSH_PORT} (user: runner)"
          else
            echo "::error::sshd failed to start on port ${SSH_PORT}"
            exit 1
          fi

      - name: Install opencode
        id: opencode
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Restore home cache (archive, before entrypoint)
        # Restored AFTER all apps are installed (tailscale, sshd, opencode) and BEFORE the entrypoint step.
        # v2: a single sudo-made tarball, not raw files - root readers are preserved (docker bind-mounts
        # leave root-owned files the 'runner' step user cannot read). Key never matches directly; restore-keys
        # picks the most recent finished run's snapshot.
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.node-home.tzst
          key: node-home-v3-${{ env.CACHED_NODE_HOST }}-${{ github.run_id }}-${{ github.run_attempt }}

          restore-keys: node-home-v3-${{ env.CACHED_NODE_HOST }}-

      - name: Unpack home cache (sudo, restoring ownership and modes)
        run: |
          if [ -f /home/runner/.node-home.tzst ]; then
            if sudo tar --use-compress-program=unzstd -xf /home/runner/.node-home.tzst -C /home/runner --same-owner --numeric-owner -p; then
              rm -f /home/runner/.node-home.tzst
              echo "[cache] home unpacked (owners/modes preserved)"
            else
              echo "::warning::home archive corrupt - falling back to the fresh baseline"
              sudo rm -f /home/runner/.node-home.tzst
            fi
          else
            echo "[cache] no home snapshot found - keeping the fresh baseline"
          fi

      - name: Restore docker state cache (archive)
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.node-docker.tzst
          key: node-docker-v1-${{ env.CACHED_NODE_HOST }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: node-docker-v1-${{ env.CACHED_NODE_HOST }}-

      - name: Unpack docker cache (stop daemon, restore, start)
        run: |
          if [ -f /home/runner/.node-docker.tzst ]; then
            NEWDR=$(docker info -f '{{.DockerRootDir}}' 2>/dev/null || true)
            NEWDR="${NEWDR:-/var/lib/docker}"
            echo "[docker] unpacking to data-root: $NEWDR"
            sudo systemctl stop docker docker.socket || true
            sudo rm -rf "$NEWDR"
            if sudo tar --use-compress-program=unzstd -xf /home/runner/.node-docker.tzst \
                 --transform="s,^docker-root,$(basename "$NEWDR")," \
                 -C "$(dirname "$NEWDR")" --same-owner --numeric-owner -p; then
              echo "[cache] docker state unpacked"
            else
              echo "::warning::docker archive corrupt - wiping leftovers, keeping a fresh daemon"
              sudo rm -rf "$NEWDR"
            fi
            rm -f /home/runner/.node-docker.tzst
            sudo systemctl start docker
          else
            echo "[cache] no docker snapshot found - keeping the fresh daemon"
          fi

      - name: Start services & wait for stop
        run: |
          set -u
          STOP_FLAG=/tmp/stop-now
          rm -f "$STOP_FLAG"

          nohup env OPENCODE_SERVER_PASSWORD="${SSH_PASSWORD}" \
            "$HOME/.opencode/bin/opencode" serve \
            --hostname 0.0.0.0 --port "${OPENCODE_PORT}" \
            >/tmp/opencode.log 2>&1 &

          sudo tailscale serve --bg "${SSH_PORT}"
          sudo tailscale serve --bg "${OPENCODE_PORT}"
          sudo tailscale serve --bg "${STOP_PORT}"

          python3 - <<'PY' >/tmp/stopserver.log 2>&1 &
          import http.server, os

          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  if self.path != "/stop":
                      self.send_response(404); self.end_headers(); return
                  if self.headers.get("Authorization") != f"Bearer {os.environ['STOP_TOKEN']}":
                      self.send_response(401); self.end_headers(); return
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"shutting down\n")
                  open("/tmp/stop-now", "w").write("1")
                  os._exit(0)

              def do_GET(self):
                  self.send_response(404); self.end_headers()

              def log_message(self, *a): pass

          http.server.HTTPServer(
              ("0.0.0.0", int(os.environ["STOP_PORT"])), H).serve_forever()
          PY

          ok=""
          for i in $(seq 1 60); do
            if curl -fs -u "opencode:${SSH_PASSWORD}" "http://127.0.0.1:${OPENCODE_PORT}/global/health" >/tmp/health.json 2>/dev/null; then 
              ok=1
              break
            fi
            sleep 1
          done

          if [ -z "$ok" ]; then
            echo "::error::opencode did not become healthy"
            cat /tmp/opencode.log
            exit 1
          fi

          TS_IP=$(tailscale ip -4)
          {
            echo "### ✅ ready: ssh to the runner"
            echo ""
            echo "\`\`\`bash"
            echo "ssh -p ${SSH_PORT} runner@${TS_IP}"
            echo "\`\`\`"
            echo ""
            echo "- **Password**: \`${SSH_PASSWORD}\`"
            echo "- **OpenCode UI**: \`http://${TS_IP}:${OPENCODE_PORT}\` (basic auth: opencode / password)"
            echo "- **Stop job**: \`curl -X POST http://${TS_IP}:${STOP_PORT}/stop -H 'Authorization: Bearer ${STOP_TOKEN}'\`"
            echo "- **Health**: \`$(cat /tmp/health.json)\`"
            echo "- **Git SSH**: Configured for github.com (key loaded in ~/.ssh/git_key)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo "⏳ waiting for stop request (max ~340 min) ..."
          for i in $(seq 1 2040); do
            if [ -f "$STOP_FLAG" ]; then
              echo "🛑 stop requested; tearing down"
              break
            fi
            sleep 10
            if [ $((i % 60)) -eq 0 ]; then
              echo "💓 alive: $((i/6)) min"
            fi
          done

          sudo tailscale logout || true
          pkill -f "opencode serve" || true
          sudo pkill sshd || true
          exit 0

      - name: Pack docker state (sudo)
        # Docker images/volumes/build cache live in the daemon's data-root, which is NOT always
        # /var/lib/docker (GH hosted images may relocate it). Resolve it dynamically, stop the daemon
        # first (consistent snapshot), archive under a stable in-archive name "docker-root" so a
        # differing data-root on the next boot can be remapped on unpack. Root reads preserve
        # ownership/modes - no chown of live data.
        if: always()
        id: pack_docker
        env:
          PACK_LOG: /tmp/pack-docker.log
        run: |
          DR=$(docker info -f '{{.DockerRootDir}}' 2>/dev/null || true)
          DR="${DR:-/var/lib/docker}"
          echo "[docker] data-root: $DR"
          sudo systemctl stop docker docker.socket || true
          sudo tar --use-compress-program=zstdmt -cf /home/runner/.node-docker.tzst \
            --exclude=.node-docker.tzst --transform="s,^$(basename "$DR"),docker-root," \
            -C "$(dirname "$DR")" --numeric-owner -p "$(basename "$DR")" \
            2>"$PACK_LOG" || rc=$?
          rc=${rc:-0}
          if [ $rc -ne 0 ]; then cat "$PACK_LOG"; sudo rm -f /home/runner/.node-docker.tzst; exit 1; fi
          sudo chown runner:runner /home/runner/.node-docker.tzst
          ls -lh /home/runner/.node-docker.tzst

      - name: Save docker cache
        if: always() && steps.pack_docker.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.node-docker.tzst
          key: node-docker-v1-${{ env.CACHED_NODE_HOST }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Pack home cache (sudo; keeps ownership and modes)
        # Runs after the serve step finishes. Reached on a GRACEFUL stop (POST /stop) while the VM is
        # still up - this is why the HTTP stop endpoint exists; on gh cancel it still tries (always()),
        # within the runner grace period, and may not finish.
        # sudo tar reads root-owned leftovers and stores owner/mode/timestamps in the archive -- NO chown
        # of live files. "file changed as we read it" (mutable stray files) is tolerated; any other tar
        # failure aborts AND removes partial archive so the save step cannot publish garbage.
        if: always()
        id: pack_home
        env:
          PACK_LOG: /tmp/pack-home.log
        run: |
          rc=0
          sudo tar --use-compress-program=zstdmt -cf /home/runner/.node-home.tzst \
            --exclude=.node-home.tzst --exclude=.node-docker.tzst -C /home/runner --numeric-owner -p . \
            2>"$PACK_LOG" || rc=$?
          if [ $rc -ne 0 ]; then
            if [ -n "$(sudo grep -v "file changed as we read it" "$PACK_LOG" | tr -d '[:space:]"')" ]; then
              sudo cat "$PACK_LOG"; sudo rm -f /home/runner/.node-home.tzst; exit 1
            fi
            echo "[pack] tolerated mutable-file warnings (rc=$rc):"
            sudo grep "file changed as we read it" "$PACK_LOG" || true
          fi
          sudo chown runner:runner /home/runner/.node-home.tzst
          ls -lh /home/runner/.node-home.tzst

      - name: Save home cache (after stop)
        if: always() && steps.pack_home.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.node-home.tzst
          key: node-home-v3-${{ env.CACHED_NODE_HOST }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune old node caches (single slot per prefix+hostname)
        # Keys are immutable in the Actions cache; "overwrite" is achieved by saving the current
        # snapshot under a fresh key and deleting every older one for the same prefix+hostname.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for prefix in "node-home-v3-${CACHED_NODE_HOST}-" "node-docker-v1-${CACHED_NODE_HOST}-"; do
            gh api "repos/${GH_REPO}/actions/caches?per_page=100" --paginate \
              --jq ".actions_caches | map(select(.key | startswith(\"$prefix\"))) | sort_by(.created_at) | reverse | .[1:][] | .id" \
              | while read -r id; do
                  gh api -X DELETE "repos/${GH_REPO}/actions/caches/$id" && echo "[prune] deleted cache id=$id prefix=$prefix"
                done
          done
          echo "[prune] done - one node-home + one node-docker slot per hostname remain"

      - name: Final cleanup
        if: always()
        run: |
          sudo tailscale logout || true
          sudo pkill -f "opencode serve" || true
          sudo pkill sshd || true
