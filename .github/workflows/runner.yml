name: remote-dev-runner

on:
  workflow_dispatch: {}

concurrency:
  group: remote-dev-runner
  cancel-in-progress: true

env:
  OPENCODE_PORT: 4096
  STOP_PORT: 8899
  SSH_PORT: 22

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Install & connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          untrusted-userspace: false

      - name: Configure sshd
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo mkdir -p /etc/ssh/sshd_config.d /run/sshd
          printf 'PermitRootLogin no\nPasswordAuthentication yes\nStrictModes no\n' | \
            sudo tee /etc/ssh/sshd_config.d/99-runner.conf >/dev/null
          echo "runner:${SSH_PASSWORD}" | sudo chpasswd
          sudo ssh-keygen -A
          sudo /usr/sbin/sshd -p "${SSH_PORT}"
          ss -tln | grep -q ":${SSH_PORT}"
          echo "[sshd] listening on :${SSH_PORT} (user: runner)"

      - name: Install opencode
        id: opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Start services & wait for stop
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          STOP_TOKEN: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -u
          STOP_FLAG=/tmp/stop-now
          rm -f "$STOP_FLAG"

          nohup env OPENCODE_SERVER_PASSWORD="$SSH_PASSWORD" \
            "$HOME/.opencode/bin/opencode" serve \
            --hostname 0.0.0.0 --port "${OPENCODE_PORT}" \
            >/tmp/opencode.log 2>&1 &

          sudo tailscale serve --bg "${OPENCODE_PORT}"
          sudo tailscale serve --bg "${STOP_PORT}"

          python3 - <<'PY' >/tmp/stopserver.log 2>&1 &
          import http.server, os

          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  if self.path != "/stop":
                      self.send_response(404); self.end_headers(); return
                  if self.headers.get("Authorization") != f"Bearer {os.environ['STOP_TOKEN']}":
                      self.send_response(401); self.end_headers(); return
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"shutting down\n")
                  open(os.environ.get("STOP_FLAG", "/tmp/stop-now"), "w").write("1")
                  os._exit(0)

              def do_GET(self):
                  self.send_response(404); self.end_headers()

              def log_message(self, *a): pass

          http.server.HTTPServer(
              ("0.0.0.0", int(os.environ["STOP_PORT"])), H).serve_forever()
          PY

          ok=""
          for i in $(seq 1 60); do
            if curl -fs "http://127.0.0.1:${OPENCODE_PORT}/global/health" >/tmp/health.json; then ok=1; break; fi
            sleep 1
          done
          [ -n "$ok" ] || { echo "::error::opencode did not become healthy"; cat /tmp/opencode.log; exit 1; }

          TS_IP=$(tailscale ip -4)
          {
            echo "### ready: ssh to the runner"
            echo ""
            echo "\`\`\`"
            echo "ssh -p ${SSH_PORT} runner@${TS_IP}      # password = SSH_PASSWORD secret"
            echo "\`\`\`"
            echo ""
            echo "- opencode server: \`http://${TS_IP}:${OPENCODE_PORT}\` (basic auth: opencode / SSH_PASSWORD)"
            echo "- stop the job: \`curl -X POST http://${TS_IP}:${STOP_PORT}/stop -H 'Authorization: Bearer <SSH_PASSWORD>'\`"
            echo "- health: $(cat /tmp/health.json)"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo "waiting for stop request (max ~340 min) ..."
          for i in $(seq 1 2040); do
            if [ -f "$STOP_FLAG" ]; then echo "stop requested; tearing down"; break; fi
            sleep 10
            if [ $((i % 60)) -eq 0 ]; then echo "alive: $((i/6)) min"; fi
          done

          sudo tailscale logout || true
          pkill -f "opencode serve" || true
          exit 0

      - name: Final cleanup
        if: always()
        run: sudo tailscale logout || true
